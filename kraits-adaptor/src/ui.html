<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
  <title>Kraits · Repo Coding Assistant</title>
  <style>
    :root {
      --bg: #0b0e14;
      --surface: #121722;
      --card: #171e2c;
      --border: #263147;
      --text: #eef2f9;
      --muted: #8f9fb8;
      --blue: #38bdf8;
      --green: #22c55e;
      --red: #ef4444;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body {
      height: 100%; margin: 0; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14.5px;
    }
    .shell { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

    /* HEADER */
    .topbar {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: calc(10px + env(safe-area-inset-top, 0px)) 18px 10px;
      background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 15px; }
    .repo-pill {
      font-family: var(--mono); font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px;
      background: rgba(34,197,94,.14); color: #86efac; border: 1px solid rgba(34,197,94,.32);
    }
    .top-actions { display: flex; align-items: center; gap: 8px; }
    .speed-pill {
      display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 12px;
      font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--card); border: 1px solid var(--border);
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
    .dot.live { background: var(--green); box-shadow: 0 0 0 4px rgba(34,197,94,.22); animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }

    .btn {
      background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 8px;
      padding: 5px 11px; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .btn:hover { border-color: var(--blue); color: var(--blue); }

    /* COLLAPSIBLE REPO DRAWER (hidden by default) */
    .drawer {
      display: none; background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 12px 18px; flex-shrink: 0;
    }
    .drawer.open { display: block; }
    .drawer-inner {
      max-width: 780px; margin: 0 auto; display: flex; flex-wrap: wrap;
      align-items: center; justify-content: space-between; gap: 10px;
    }
    .drawer-meta { font-size: 12.5px; color: var(--muted); }
    .drawer-btns { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }

    /* CHAT STREAM */
    .messages {
      flex: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 16px;
    }
    .msg { max-width: 780px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; }
    .msg.user { align-items: flex-end; }
    .bubble { padding: 12px 16px; border-radius: 14px; line-height: 1.55; max-width: 88%; }
    .msg.user .bubble {
      background: #0c4a6e; border: 1px solid #0284c7; color: #f0f9ff;
      border-bottom-right-radius: 4px; white-space: pre-wrap;
    }
    .msg.bot .bubble {
      background: var(--surface); border: 1px solid var(--border); width: 100%; max-width: 100%;
      border-bottom-left-radius: 4px;
    }

    .welcome-title { font-weight: 700; font-size: 15px; margin-bottom: 6px; }
    .welcome-sub { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
    .chips { display: flex; flex-wrap: wrap; gap: 7px; }
    .chip {
      background: var(--card); border: 1px solid var(--border); color: var(--text);
      padding: 6px 11px; border-radius: 999px; font-size: 12.5px; cursor: pointer;
    }
    .chip:hover { border-color: var(--blue); color: var(--blue); }

    /* LIVE STATUS */
    .status-line {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      font-size: 12.5px; color: var(--muted);
    }
    .status-main { display: flex; align-items: center; gap: 8px; }
    .status-pill { font-family: var(--mono); font-size: 11.5px; color: #7dd3fc; }
    .live-note {
      margin-top: 8px; font-family: var(--mono); font-size: 11.5px; color: var(--muted);
      background: #090c12; border: 1px solid var(--border); border-radius: 8px;
      padding: 7px 10px; white-space: pre-wrap; word-break: break-word; max-height: 90px; overflow: auto;
    }

    /* ANSWER PROSE & MARKDOWN */
    .answer { line-height: 1.6; word-break: break-word; }
    .answer p { margin: 0 0 9px; }
    .answer p:last-child { margin-bottom: 0; }
    .answer code {
      font-family: var(--mono); font-size: 12.5px; background: #0a0e17;
      border: 1px solid var(--border); padding: 1px 5px; border-radius: 5px;
    }
    .answer pre {
      background: #080b11; border: 1px solid var(--border); border-radius: 9px;
      padding: 10px 12px; overflow: auto; font-family: var(--mono); font-size: 12px;
      margin: 8px 0; white-space: pre;
    }
    .answer pre code { border: none; padding: 0; background: transparent; }

    .err-box {
      margin-top: 8px; padding: 10px 12px; border-radius: 9px; font-size: 13px;
      background: rgba(239,68,68,.12); border: 1px solid rgba(239,68,68,.35); color: #fecaca;
      white-space: pre-wrap; word-break: break-word;
    }

    /* COLLAPSIBLE ACTIVITY + DIFF DRAWER */
    details.activity {
      margin-top: 10px; border: 1px solid var(--border); border-radius: 10px; background: #090d14; overflow: hidden;
    }
    details.activity summary {
      cursor: pointer; list-style: none; padding: 8px 12px; font-size: 12px; font-weight: 600;
      color: var(--muted); display: flex; align-items: center; justify-content: space-between; gap: 8px;
      background: var(--card);
    }
    details.activity summary::-webkit-details-marker { display: none; }
    .badge { padding: 2px 7px; border-radius: 5px; font-family: var(--mono); font-size: 11px; font-weight: 700; }
    .badge.pass { background: rgba(34,197,94,.2); color: #86efac; }
    .badge.fail { background: rgba(239,68,68,.2); color: #fca5a5; }
    .act-body { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
    .step-item { font-family: var(--mono); font-size: 11.5px; color: #cbd5e1; white-space: pre-wrap; word-break: break-word; }
    .diff-wrap { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: #06090f; }
    .diff-bar {
      display: flex; align-items: center; justify-content: space-between; padding: 5px 10px;
      background: #101624; font-family: var(--mono); font-size: 11px; color: var(--muted);
    }
    pre.diff-pre {
      margin: 0; padding: 10px 12px; font-family: var(--mono); font-size: 11.5px; line-height: 1.45;
      overflow: auto; max-height: 280px; white-space: pre;
    }

    /* COMPOSER */
    .composer-wrap {
      padding: 10px 16px calc(14px + env(safe-area-inset-bottom, 0px));
      background: var(--surface); border-top: 1px solid var(--border); flex-shrink: 0;
    }
    .composer {
      max-width: 780px; margin: 0 auto; background: var(--bg); border: 1px solid var(--border);
      border-radius: 13px; padding: 9px 12px; display: flex; gap: 8px; align-items: flex-end;
    }
    .composer:focus-within { border-color: var(--blue); }
    textarea {
      flex: 1; background: transparent; border: none; outline: none; color: var(--text);
      font-family: inherit; font-size: 14.5px; resize: none; min-height: 24px; max-height: 140px; line-height: 1.4;
    }
    button.send {
      background: #0284c7; color: #fff; border: none; border-radius: 9px;
      padding: 8px 16px; font-weight: 700; font-size: 13.5px; cursor: pointer; flex-shrink: 0;
    }
    button.send:disabled { opacity: .45; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <span>Kraits</span>
        <span class="repo-pill" id="repo-badge">pallets/flask</span>
      </div>
      <div class="top-actions">
        <div class="speed-pill">
          <span id="live-dot" class="dot"></span>
          <span id="top-tps">— t/s</span>
        </div>
        <button class="btn" onclick="toggleDrawer()">Repo ▾</button>
      </div>
    </header>

    <section class="drawer" id="repo-drawer">
      <div class="drawer-inner">
        <div class="drawer-meta" id="drawer-meta">Loading repo metadata...</div>
        <div class="drawer-btns">
          <button class="btn" onclick="runPytestCheck()">Run Pytest</button>
          <button class="btn" onclick="resetRepo()">Reset Clean</button>
          <button class="btn" onclick="usePreset('bug1')">Demo Bug 1</button>
          <button class="btn" onclick="usePreset('bug2')">Demo Bug 2</button>
          <span id="drawer-status" style="font-family:var(--mono);font-size:11.5px;color:var(--muted)"></span>
        </div>
      </div>
    </section>

    <main class="messages" id="messages">
      <div class="msg bot">
        <div class="bubble">
          <div class="welcome-title">Ask anything or describe a bug in <span id="welcome-repo">pallets/flask</span></div>
          <div class="welcome-sub" id="welcome-meta">Indexing AST &amp; learned repo memory...</div>
          <div class="chips">
            <button class="chip" onclick="quickAsk('Hello')">Hello</button>
            <button class="chip" onclick="quickAsk('Explain how stream_with_context works in src/flask/helpers.py.')">Explain stream_with_context</button>
            <button class="chip" onclick="usePreset('feat1')">Add Flask.route_summary()</button>
          </div>
        </div>
      </div>
    </main>

    <footer class="composer-wrap">
      <div class="composer">
        <textarea id="chat-input" rows="1" placeholder="Message Kraits..." onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault();sendChat();}"></textarea>
        <button class="send" id="send-btn" onclick="sendChat()">Send</button>
      </div>
    </footer>
  </div>

  <script>
    const PRESETS = {
      bug1: {
        demoAction: "bug1",
        prompt: "Fix the failing TestHelpers::test_get_debug_flag bug in src/flask/helpers.py so FLASK_DEBUG=\"0\", \"False\", and \"No\" return False cleanly, then verify with python -m pytest tests/test_helpers.py -q."
      },
      bug2: {
        demoAction: "bug2",
        prompt: "Fix the failing Config.get_namespace() bug in src/flask/config.py so keys are properly trimmed when trim_namespace=True, then verify with python -m pytest tests/test_config.py -q."
      },
      feat1: {
        demoAction: null,
        prompt: "In src/flask/app.py add Flask.route_summary(self) iterating self.url_map.iter_rules() returning sorted dicts {endpoint, rule, methods} excluding HEAD and OPTIONS (guarding rule.methods against None), add tests in tests/test_route_summary.py, and verify with python -m pytest tests/test_route_summary.py tests/test_basic.py -q."
      }
    };

    let pollTimer = null;
    let pendingDemoAction = null;

    function toggleDrawer() {
      document.getElementById('repo-drawer').classList.toggle('open');
    }

    function esc(s) {
      return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function renderMarkdown(text) {
      const blocks = [];
      let tmp = (text || '').replace(/```(\w*)\n([\s\S]*?)```/g, (_, _lang, code) => {
        const idx = blocks.length;
        blocks.push(`<pre><code>${esc(code)}</code></pre>`);
        return `\x00BLOCK${idx}\x00`;
      });
      tmp = esc(tmp)
        .replace(/`([^`\n]+)`/g, (_, c) => `<code>${c}</code>`)
        .replace(/\*\*([^*]+)\*\*/g, (_, b) => `<strong>${b}</strong>`);
      const html = tmp.split(/\n{2,}/).map(p => {
        if (p.includes('\x00BLOCK')) return p;
        return `<p>${p.replace(/\n/g, '<br>')}</p>`;
      }).join('');
      return html.replace(/\x00BLOCK(\d+)\x00/g, (_, i) => blocks[Number(i)]);
    }

    function quickAsk(txt) {
      pendingDemoAction = null;
      document.getElementById('chat-input').value = txt;
      sendChat();
    }

    async function usePreset(id) {
      const p = PRESETS[id];
      if (!p) return;
      document.getElementById('repo-drawer').classList.remove('open');
      if (p.demoAction) {
        document.getElementById('drawer-status').textContent = 'Injecting demo bug...';
        await fetch('/kraits/demo', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({action: p.demoAction})
        });
      }
      document.getElementById('chat-input').value = p.prompt;
      document.getElementById('chat-input').focus();
    }

    async function refreshRepo() {
      const [rRepo, rMem] = await Promise.all([
        fetch('/kraits/repo').then(r => r.json()),
        fetch('/kraits/memory').then(r => r.json()),
      ]);
      const files = (rRepo.files || []).length;
      const lessons = (rMem.lessons || []).length;
      const rName = rRepo.repo_name || 'pallets/flask';
      document.getElementById('repo-badge').textContent = rName;
      document.getElementById('welcome-repo').textContent = rName;
      document.getElementById('welcome-meta').textContent = `${files} Python files indexed · ${lessons} learned repo lessons`;
      document.getElementById('drawer-meta').textContent = `${rName} · ${files} AST files · ${lessons} learned lessons`;
    }

    async function runPytestCheck() {
      const el = document.getElementById('drawer-status');
      el.textContent = 'Running pytest...';
      el.style.color = 'var(--muted)';
      const res = await fetch('/kraits/demo', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({action: 'pytest', target: 'tests/test_helpers.py tests/test_config.py'})
      }).then(r => r.json());
      el.textContent = res.ok ? 'PASS (exit 0)' : `FAIL (exit ${res.exit_code})`;
      el.style.color = res.ok ? '#86efac' : '#fca5a5';
    }

    async function resetRepo() {
      const el = document.getElementById('drawer-status');
      const res = await fetch('/kraits/demo', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({action: 'reset'})
      }).then(r => r.json());
      el.textContent = res.ok ? 'Reset clean' : 'Reset failed';
      el.style.color = res.ok ? '#86efac' : '#fca5a5';
      refreshRepo();
    }

    function copyDiff(btn, rawText) {
      navigator.clipboard.writeText(rawText).then(() => {
        const old = btn.textContent;
        btn.textContent = 'Copied';
        setTimeout(() => { btn.textContent = old; }, 1200);
      });
    }

    function friendlyPhase(phase) {
      if (!phase) return 'Working...';
      if (phase.includes('Prefilling')) return 'Reading prompt & repo context...';
      if (phase.includes('Running `ast_symbol`') || phase.includes('Running `read_file`')) return 'Reading source files...';
      if (phase.includes('Running `search_repo`')) return 'Searching repository...';
      if (phase.includes('Running `replace_in_file`') || phase.includes('Running `write_to_file`')) return 'Applying code edit...';
      if (phase.includes('Running `execute_command`')) return 'Running verification command...';
      return phase;
    }

    async function sendChat() {
      const input = document.getElementById('chat-input');
      const prompt = input.value.trim();
      if (!prompt) return;

      input.value = '';
      document.getElementById('send-btn').disabled = true;
      document.getElementById('live-dot').classList.add('live');

      const msgsEl = document.getElementById('messages');
      msgsEl.insertAdjacentHTML('beforeend', `<div class="msg user"><div class="bubble">${esc(prompt)}</div></div>`);

      const botId = 'bot_' + Date.now();
      msgsEl.insertAdjacentHTML('beforeend',
        `<div class="msg bot" id="${botId}"><div class="bubble">` +
        `<div class="status-line" id="${botId}-status"><span class="status-main" id="${botId}-phase">Thinking...</span><span class="status-pill" id="${botId}-meta">—</span></div>` +
        `<div class="live-note" id="${botId}-live" style="display:none"></div>` +
        `<div id="${botId}-body"></div>` +
        `</div></div>`
      );
      msgsEl.scrollTop = msgsEl.scrollHeight;

      const started = await fetch('/kraits/task', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({prompt})
      }).then(r => r.json());
      if (!started.task_id) {
        document.getElementById(`${botId}-phase`).textContent = 'Error';
        document.getElementById(`${botId}-body`).innerHTML = `<div class="err-box">${esc(started.error || 'Failed to start task')}</div>`;
        document.getElementById('live-dot').classList.remove('live');
        document.getElementById('send-btn').disabled = false;
        return;
      }

      const runStartedAt = Date.now();
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(() => pollRun(started.task_id, botId, runStartedAt), 350);
      pollRun(started.task_id, botId, runStartedAt);
    }

    async function pollRun(taskId, botId, runStartedAt) {
      const t = await fetch('/kraits/task?id=' + encodeURIComponent(taskId)).then(r => r.json());
      const wallS = Math.max(t.elapsed_s || 0, (Date.now() - runStartedAt) / 1000).toFixed(1);
      const tpsTxt = t.live_tps > 0 ? `${t.live_tps.toFixed(1)} t/s` : '— t/s';
      document.getElementById('top-tps').textContent = tpsTxt;

      const phaseEl = document.getElementById(`${botId}-phase`);
      const metaEl = document.getElementById(`${botId}-meta`);
      const liveEl = document.getElementById(`${botId}-live`);

      if (t.status === 'running') {
        phaseEl.textContent = friendlyPhase(t.live_phase);
        metaEl.textContent = `${tpsTxt} · ${wallS}s`;
        const showPreview = (t.live_stream || '').trim();
        if (showPreview) {
          liveEl.style.display = 'block';
          liveEl.textContent = showPreview;
        } else {
          liveEl.style.display = 'none';
        }
        return;
      }

      clearInterval(pollTimer); pollTimer = null;
      document.getElementById('live-dot').classList.remove('live');
      document.getElementById('send-btn').disabled = false;
      liveEl.style.display = 'none';

      const statusRow = document.getElementById(`${botId}-status`);
      statusRow.style.marginBottom = '8px';
      phaseEl.textContent = t.status === 'completed' ? 'Kraits' : 'Failed';
      metaEl.textContent = `${tpsTxt} · ${t.elapsed_s}s`;

      const bodyEl = document.getElementById(`${botId}-body`);
      let html = '';
      if (t.status === 'completed') {
        html += `<div class="answer">${renderMarkdown(t.final_result || 'Done.')}</div>`;
      } else {
        html += `<div class="err-box">${esc(t.error || 'Task failed')}</div>`;
      }

      const allTools = (t.turns || []).flatMap(tr => (tr.tools || []).map(tl => ({...tl, tps: tr.tok_per_sec})));
      const diffTxt = (t.diff || '').trim();
      if (allTools.length > 0 || diffTxt) {
        const lastExec = allTools.filter(tl => tl.name === 'execute_command').pop();
        const badgeCls = (t.status === 'completed' && (!lastExec || lastExec.ok)) ? 'pass' : 'fail';
        const badgeTxt = lastExec ? (lastExec.ok ? 'PYTEST PASS' : 'PYTEST FAIL') : (t.status === 'completed' ? 'DONE' : 'ERROR');
        const summaryBits = [`${allTools.length} step${allTools.length === 1 ? '' : 's'}`];
        if (diffTxt) summaryBits.push('diff included');

        const stepsHtml = allTools.map(tl =>
          `<div class="step-item">${tl.ok ? '✓' : '✕'} <strong>${esc(tl.name)}</strong> · ${esc(tl.detail)}</div>`
        ).join('');

        const diffHtml = diffTxt
          ? `<div class="diff-wrap"><div class="diff-bar"><span>Unified Diff</span><button class="btn" id="${botId}-copy">Copy Diff</button></div><pre class="diff-pre" id="${botId}-diffpre"></pre></div>`
          : '';

        html += `<details class="activity"><summary><span>▸ Activity · ${summaryBits.join(' · ')}</span><span class="badge ${badgeCls}">${badgeTxt}</span></summary><div class="act-body">${stepsHtml}${diffHtml}</div></details>`;
      }

      bodyEl.innerHTML = html;
      if (diffTxt) {
        document.getElementById(`${botId}-diffpre`).textContent = t.diff;
        document.getElementById(`${botId}-copy`).onclick = function() { copyDiff(this, t.diff); };
      }

      refreshRepo();
      const msgsEl = document.getElementById('messages');
      msgsEl.scrollTop = msgsEl.scrollHeight;
    }

    refreshRepo();
  </script>
</body>
</html>
